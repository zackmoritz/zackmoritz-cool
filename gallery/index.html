<script>
(async () => {
  const res = await fetch('/gallery/photos.json',{cache:'no-store'});
  const data = await res.json();
  const entries = data.files || [];

  // prefix after /gallery
  const after = location.pathname.replace(/^\/?gallery\/?/, '');
  const prefix = after === '' ? '' : (after.endsWith('/') ? after : after + '/');
  const parts = prefix.split('/').filter(Boolean);

  // breadcrumbs
  const nav = document.createElement('nav');
  let acc = '';
  const crumbs = ['<a href="/gallery">/gallery</a>'];
  for (const p of parts) { acc += p + '/'; crumbs.push(`<a href="/gallery/${acc}">${p}</a>`); }
  nav.innerHTML = crumbs.join(' ▸ ');
  document.body.prepend(nav);

  // build folder/file lists
  const subs = new Set(), here = [];
  for (const f of entries) {
    const p = String(f.path).replace(/^\/?gallery\//, '');
    if (!p.startsWith(prefix)) continue;
    const rest = p.slice(prefix.length);
    const slash = rest.indexOf('/');
    if (slash === -1) here.push({ ...f, path: p });
    else subs.add(rest.slice(0, slash + 1));
  }

  // segment-safe encoder
  const enc = (p) => p.split('/').map(encodeURIComponent).join('/');

  // folders grid
  if (subs.size) {
    const div = document.createElement('div');
    div.className='folders';
    for (const s of Array.from(subs).sort()) {
      const a = document.createElement('a');
      a.href = '/gallery/' + enc(prefix + s); // encode segments, keep slashes
      a.textContent = '📁 ' + s.replace(/\/$/, '');
      div.append(a);
    }
    document.querySelector('header').after(div);
  }

  // file grid
  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  const count = document.getElementById('count');

  const render = list => {
    grid.innerHTML='';
    for (const f of list) {
      const url = '/gallery/' + enc(f.path); // encode segments
      const fig=document.createElement('figure');
      fig.innerHTML=`<a href="${url}" target="_blank" rel="noopener">
        <img src="${url}" alt="${f.path}">
      </a>
      <figcaption>${f.path.split('/').pop()}</figcaption>`;
      grid.append(fig);
    }
    count.textContent = `${list.length} file${list.length!==1?'s':''}` + (prefix ? ` in ${prefix}` : '');
  };

  render(here);
  q.oninput = () => {
    const needle = q.value.trim().toLowerCase();
    render(here.filter(f => f.path.toLowerCase().includes(needle)));
  };
})();
</script>

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zack’s Gallery</title>
<style>
  :root { --gap:12px }
  body{margin:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center;margin-bottom:8px}
  nav.breadcrumbs{font-size:14px;color:#666;word-break:break-all;margin:6px 0 10px}
  .grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  figure{margin:0;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden}
  img{width:100%;height:160px;object-fit:cover;display:block;background:#fff}
  figcaption{font-size:12px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  input[type="search"]{padding:8px 10px;min-width:220px}
  .meta{color:#666;font-size:14px}
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--gap);margin:12px 0}
  .folders a{display:block;padding:14px;border:1px solid #e5e5e5;border-radius:8px;background:#fafafa;text-decoration:none;color:inherit}
  .muted{color:#666}
</style>

<header>
  <strong id="count">Loading…</strong>
  <input id="q" type="search" placeholder="Filter by filename…">
  <span id="sort" class="meta"></span>
</header>

<nav class="breadcrumbs" id="crumbs" aria-label="Breadcrumb"></nav>
<div id="folders" class="folders" hidden></div>
<div id="grid" class="grid" aria-live="polite"></div>

<script>
(async () => {
  const el = {
    count: document.getElementById('count'),
    sort:  document.getElementById('sort'),
    q:     document.getElementById('q'),
    crumbs:document.getElementById('crumbs'),
    folders:document.getElementById('folders'),
    grid:  document.getElementById('grid'),
  };

  const enc = (p) => p.split('/').map(encodeURIComponent).join('/');                 // keep slashes
  const normPath = (p) => String(p).replace(/^\/+/, '').replace(/^gallery\//, '');  // strip leading "/" or "gallery/"
  const forwardSlashes = (p) => p.split('\\').join('/');

  function getPrefixFromPath(pathname = location.pathname){
    const after = pathname.replace(/^\/?gallery\/?/, '');
    return after === '' ? '' : (after.endsWith('/') ? after : after + '/');
  }

  function setCount(total, prefix, foldersCount, visibleCount){
    // Show total files overall + current folder context + visible filtered count (if filtered)
    const pieces = [];
    pieces.push(`${total} total file${total!==1?'s':''}`);
    if (prefix) pieces.push(`in ${prefix}`);
    if (typeof visibleCount === 'number' && visibleCount !== undefined) {
      pieces.push(`• showing ${visibleCount}`);
    }
    if (foldersCount) pieces.push(`• ${foldersCount} folder${foldersCount!==1?'s':''}`);
    el.count.textContent = pieces.join(' ');
  }

  function renderCrumbs(prefix){
    const parts = prefix.split('/').filter(Boolean);
    let acc = '';
    const items = [`<a href="/gallery" data-nav-root>/gallery</a>`];
    for (const p of parts) {
      acc += p + '/';
      items.push(`<a href="/gallery/${enc(acc)}" data-nav="${acc}">${p}</a>`);
    }
    el.crumbs.innerHTML = items.join(' ▸ ');
  }

  function splitFolder(entries, prefix){
    const subs = new Set(), here = [];
    for (const raw of entries) {
      const f = { ...raw, path: normPath(forwardSlashes(raw.path)) }; // "2025/trip/IMG.jpg"
      if (!f.path.startsWith(prefix)) continue;
      const rest = f.path.slice(prefix.length);
      const slash = rest.indexOf('/');
      if (slash === -1) here.push(f);
      else subs.add(rest.slice(0, slash + 1)); // keep trailing '/'
    }
    return { subs: Array.from(subs).sort(), here };
  }

  function renderFolders(prefix, subs){
    if (!subs.length) { el.folders.hidden = true; el.folders.innerHTML = ''; return; }
    el.folders.hidden = false;
    el.folders.innerHTML = '';
    for (const s of subs) {
      const a = document.createElement('a');
      a.href = '/gallery/' + enc(prefix + s);   // pretty URL
      a.dataset.nav = prefix + s;               // SPA hook
      a.textContent = '📁 ' + s.replace(/\/$/, '');
      el.folders.appendChild(a);
    }
  }

  function renderFiles(list){
    el.grid.innerHTML = '';
    for (const f of list) {
      const url = '/gallery/' + enc(f.path);
      const fig = document.createElement('figure');
      fig.innerHTML = `<a href="${url}" target="_blank" rel="noopener">
          <img loading="lazy" decoding="async" src="${url}" alt="${f.path}">
        </a>
        <figcaption>${f.path.split('/').pop()}</figcaption>`;
      el.grid.appendChild(fig);
    }
  }

  function navigateTo(newPrefix){
    const url = '/gallery/' + newPrefix;
    history.pushState({ prefix: newPrefix }, '', url); // SPA (no reload)
    renderFolder(newPrefix);
  }

  window.addEventListener('popstate', (e) => {
    const pref = e.state?.prefix ?? getPrefixFromPath();
    renderFolder(pref);
  });

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-nav], a[data-nav-root]');
    if (!a) return;
    e.preventDefault();
    if (a.hasAttribute('data-nav-root')) return navigateTo('');
    navigateTo(a.dataset.nav || '');
  });

  // --- Load manifest once ---
  try {
    const res = await fetch('/gallery/photos.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`photos.json ${res.status}`);
    const data = await res.json();

    // Normalize all entry paths; keep order from manifest (already newest→oldest)
    const all = (data.files || [])
      .filter(f => f && f.path)
      .map(f => ({ ...f, path: normPath(forwardSlashes(f.path)) }));

    const TOTAL = data.count || all.length;
    if (data.sort) el.sort.textContent = `Sorted: ${data.sort}`;

    function renderFolder(prefix){
      renderCrumbs(prefix);
      const { subs, here } = splitFolder(all, prefix);
      renderFolders(prefix, subs);
      renderFiles(here);
      setCount(TOTAL, prefix, subs.length, here.length);

      // folder-scoped search
      el.q.oninput = () => {
        const needle = el.q.value.trim().toLowerCase();
        const filtered = here.filter(f => f.path.toLowerCase().includes(needle));
        renderFiles(filtered);
        setCount(TOTAL, prefix, subs.length, filtered.length);
      };
    }

    // Initial render (supports deep links if _redirects sends /gallery/* → index.html)
    renderFolder(getPrefixFromPath());

  } catch (err) {
    console.error(err);
    el.count.textContent = 'Error: ' + (err?.message || err);
    el.count.classList.add('muted');
  }
})();
</script>

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zack’s Gallery</title>
<style>
  body{margin:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  figure{margin:0;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden}
  img{width:100%;height:160px;object-fit:cover;display:block}
  figcaption{font-size:12px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  input[type="search"]{padding:8px 10px;min-width:220px}
  .meta{color:#666;font-size:14px}
</style>
<header>
  <strong id="count">Loading…</strong>
  <input id="q" type="search" placeholder="Filter by filename…">
  <span id="sort" class="meta"></span>
</header>
<div id="grid" class="grid" aria-live="polite"></div>
<script>
(async () => {
  // 1) Always load the manifest from /gallery/
  const res = await fetch('/gallery/photos.json', { cache: 'no-store' });
  if (!res.ok) { document.getElementById('count').textContent = 'No manifest found.'; return; }
  const data = await res.json();

  // Guard + normalize paths to be relative to gallery root (no leading slash)
  const entries = (data.files || [])
    .filter(f => f && f.path)
    .map(f => ({ ...f, path: f.path.replace(/^\/+/, '') }));

  // 2) Current folder prefix from URL, relative to /gallery/
  const pathAfterGallery = location.pathname.replace(/^\/?gallery\/?/, '');
  const currentPrefix = pathAfterGallery.endsWith('/') || pathAfterGallery === '' 
    ? pathAfterGallery 
    : pathAfterGallery + '/';

  // Build lists
  const subfolders = new Set();
  const filesHere = [];
  for (const f of entries) {
    if (!f.path.startsWith(currentPrefix)) continue;
    const rest = f.path.slice(currentPrefix.length);
    const slash = rest.indexOf('/');
    if (slash === -1) {
      filesHere.push(f); // direct child
    } else {
      subfolders.add(rest.slice(0, slash+1)); // immediate subfolder (keep trailing /)
    }
  }

  // DOM helpers
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const sort = document.getElementById('sort');
  const q = document.getElementById('q');

  // Breadcrumbs
  const headerEl = document.querySelector('header');
  const crumbs = document.createElement('nav');
  crumbs.style.fontSize = '14px';
  crumbs.style.color = '#666';
  crumbs.style.wordBreak = 'break-all';

  const parts = currentPrefix ? currentPrefix.split('/').filter(Boolean) : [];
  let acc = '';
  const links = ['<a href="/gallery">/gallery</a>'];
  for (const p of parts) {
    acc += p + '/';
    links.push(`<a href="/gallery/${encodeURI(acc)}">${p}</a>`);
  }
  crumbs.innerHTML = links.join(' ▸ ');
  headerEl.appendChild(crumbs);

  // Folder tiles
  const foldersDiv = document.createElement('div');
  foldersDiv.className = 'folders';
  foldersDiv.style.display = 'grid';
  foldersDiv.style.gridTemplateColumns = 'repeat(auto-fill,minmax(160px,1fr))';
  foldersDiv.style.gap = '12px';
  foldersDiv.style.margin = '8px 0 8px 0';

  if (subfolders.size) {
    for (const folder of Array.from(subfolders).sort()) {
      const a = document.createElement('a');
      a.href = '/gallery/' + encodeURI(currentPrefix + folder);
      a.style.display = 'block';
      a.style.padding = '14px';
      a.style.border = '1px solid #e5e5e5';
      a.style.borderRadius = '8px';
      a.style.background = '#fafafa';
      a.style.textDecoration = 'none';
      a.style.color = 'inherit';
      a.innerHTML = `📁 ${folder.replace(/\/$/, '')}`;
      foldersDiv.appendChild(a);
    }
    grid.before(foldersDiv);
  }

  // Render files in this folder (not recursive)
  const safeURL = (p) => encodeURI(p);
  function render(list){
    grid.innerHTML = '';
    for (const f of list) {
      const name = f.path; // relative to gallery root
      const t = f.t ? new Date(f.t).toISOString().slice(0,16).replace('T',' ') : '';
      // 3) Prefix all file URLs with /gallery/
      const url = '/gallery/' + safeURL(name);
      const fig = document.createElement('figure');
      fig.dataset.name = name.toLowerCase();
      fig.innerHTML = `<a href="${url}" target="_blank" rel="noopener">
        <img loading="lazy" decoding="async" src="${url}" alt="${name}">
      </a>
      <figcaption>${name.split('/').pop()}${t ? `<br><small>${t}</small>`:''}</figcaption>`;
      grid.appendChild(fig);
    }
    count.textContent = `${list.length} file${list.length!==1?'s':''}` + (currentPrefix ? ` in ${currentPrefix}` : '');
    if (sort) sort.textContent = data.sort ? `Sorted: ${data.sort}` : '';
  }

  // Filtering within the current folder
  const filesHereSorted = filesHere; // already newest→oldest from manifest
  q.addEventListener('input', () => {
    const needle = q.value.trim().toLowerCase();
    render(filesHereSorted.filter(f => f.path.toLowerCase().includes(needle)));
  });

  render(filesHereSorted);
})();
</script>

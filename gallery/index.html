<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zack’s Gallery</title>
<style>
  body{margin:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  figure{position:relative;margin:0;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden}
  img{width:100%;height:160px;object-fit:cover;display:block;background:#fff}
  figcaption{font-size:12px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  input[type="search"]{padding:8px 10px;min-width:220px}
  .meta{color:#666;font-size:14px}
  .badge{position:absolute;top:6px;left:6px;background:#d61f1f;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;display:none}
  figure.err .badge{display:inline-block}
</style>
<header>
  <strong id="count">Loading…</strong>
  <input id="q" type="search" placeholder="Filter by filename…">
  <span id="sort" class="meta"></span>
</header>
<div id="grid" class="grid" aria-live="polite"></div>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const count = $('count'), sort = $('sort'), grid = $('grid'), q = $('q');

  const encodeSegs = p => p.split('/').map(encodeURIComponent).join('/');

  function fail(msg){ console.error(msg); count.textContent = msg; }

  try {
    // Flat view expects photos.json right next to this file
    const res = await fetch('/gallery/photos.json', { cache: 'no-store' });
    if (!res.ok) return fail(`photos.json ${res.status} — is it at /gallery/photos.json?`);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { return fail('photos.json parse error — did routing return HTML?'); }

    const entries = (data.files || [])
      .filter(f => f && f.path)
      .map(f => ({ ...f, path: String(f.path).replace(/^\/+/, '') })); // no leading slash

    // Render flat list (no subfolders)
    const failures = [];
    function render(list){
      grid.innerHTML = '';
      for (const f of list) {
        const file = f.path;               // filename only in flat mode
        const t = f.t ? new Date(f.t).toISOString().slice(0,16).replace('T',' ') : '';
        const url = '/gallery/' + encodeSegs(file);

        const fig = document.createElement('figure');
        fig.dataset.name = file.toLowerCase();
        fig.innerHTML = `<span class="badge"></span>
          <a href="${url}" target="_blank" rel="noopener">
            <img loading="lazy" decoding="async" alt="${file}">
          </a>
          <figcaption>${file}${t ? `<br><small>${t}</small>`:''}</figcaption>`;

        const img = fig.querySelector('img');
        img.onerror = () => {
          failures.push(url);
          fig.classList.add('err');
          fig.querySelector('.badge').textContent = '404';
        };
        img.src = url;

        grid.appendChild(fig);
      }
      count.textContent = `${list.length} file${list.length!==1?'s':''}`;
      sort.textContent = data.sort ? `Sorted: ${data.sort}` : '';
    }

    const sorted = entries; // trust manifest order (newest-first, etc.)
    q.addEventListener('input', () => {
      const needle = q.value.trim().toLowerCase();
      render(sorted.filter(f => f.path.toLowerCase().includes(needle)));
    });

    render(sorted);
  } catch (e) {
    fail('Fetch failed: ' + e.message);
  }
})();
</script>

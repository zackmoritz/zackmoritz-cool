<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Gratitude List Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060a12;
      --panel: rgba(17, 23, 35, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #f2f6ff;
      --muted: #8d9bb6;
      --accent: #7fc4ff;
      --accent-strong: #45a1ff;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #121c32 0%, #030509 70%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 48px 20px 18px;
    }

    main {
      padding: 0 20px 80px;
      flex: 1;
    }

    .wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 3.2rem);
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 14px 0 0;
      max-width: 70ch;
      line-height: 1.6;
      color: var(--muted);
    }

    .panel {
      margin: 32px 0 26px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      padding: 20px;
      display: grid;
      gap: 20px;
    }

    @media (min-width: 720px) {
      .panel {
        grid-template-columns: minmax(0, 1fr) 250px;
        align-items: center;
      }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.15s ease, border 0.15s ease, background 0.15s ease;
    }

    .chip:hover,
    .chip:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(127, 196, 255, 0.5);
    }

    .chip.active {
      background: rgba(127, 196, 255, 0.18);
      border-color: rgba(127, 196, 255, 0.8);
      color: #f8fbff;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(8, 12, 20, 0.9);
      color: inherit;
      font-size: 0.96rem;
    }

    .search svg {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .summary {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.94rem;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .summary strong {
      color: #f6f9ff;
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }

    .card {
      background: rgba(4, 7, 13, 0.7);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border 0.15s ease;
    }

    .card:hover,
    .card:focus-within {
      transform: translateY(-3px);
      border-color: rgba(127, 196, 255, 0.4);
    }

    .card button {
      all: unset;
      cursor: pointer;
      display: block;
      flex: 1;
    }

    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #101723;
    }

    .card footer {
      padding: 12px 14px 14px;
      display: grid;
      gap: 6px;
    }

    .card .title {
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .card .meta {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 0;
      font-size: 1rem;
    }

    .pagination {
      margin: 34px 0 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pagination button {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      padding: 10px 16px;
      border-radius: 12px;
      min-width: 120px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: border 0.15s ease, background 0.15s ease;
    }

    .pagination button[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagination button:not([disabled]):hover,
    .pagination button:not([disabled]):focus-visible {
      outline: none;
      border-color: rgba(127, 196, 255, 0.5);
      background: rgba(127, 196, 255, 0.14);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      width: min(900px, 100%);
      max-height: 90vh;
      background: rgba(10, 15, 25, 0.94);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .lightbox header,
    .lightbox footer {
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .lightbox main {
      padding: 0;
      flex: 1;
      background: #020305;
      display: grid;
      place-items: center;
    }

    .lightbox img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #020305;
    }

    .lightbox button,
    .lightbox a {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      padding: 8px 14px;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.9rem;
      transition: border 0.15s ease, background 0.15s ease;
    }

    .lightbox button:hover,
    .lightbox button:focus-visible,
    .lightbox a:hover,
    .lightbox a:focus-visible {
      outline: none;
      border-color: rgba(127, 196, 255, 0.5);
      background: rgba(127, 196, 255, 0.16);
    }

    .lightbox .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      clip: rect(0 0 0 0);
      overflow: hidden;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Digital Gratitude List</h1>
      <p class="lead">Explore every archived treasure from the Garage and Workshop. Filter by collection or search by name, then open any image to view the original photograph.</p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="panel" aria-label="Gallery controls">
        <div class="chips" id="chipList" role="tablist" aria-label="Collections">
          <button class="chip active" data-folder="all" role="tab" aria-selected="true">All collections</button>
        </div>
        <label class="search">
          <span class="sr-only">Search images</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.79l5 5L20.5 19zm-5 0A4.5 4.5 0 1 1 15 9.5 4.5 4.5 0 0 1 10.5 14z" />
          </svg>
          <input id="search" type="search" placeholder="Search by name" autocomplete="off" />
        </label>
      </section>

      <p class="summary" id="summary" aria-live="polite">Loading images…</p>
      <div class="grid" id="gallery" aria-live="polite" aria-busy="true"></div>
      <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
    <div class="lightbox-content">
      <header>
        <h2 id="lightboxTitle"></h2>
        <button type="button" id="closeLightbox">Close</button>
      </header>
      <main>
        <img id="lightboxImage" alt="" />
      </main>
      <footer>
        <span id="lightboxMeta"></span>
        <div class="actions">
          <button type="button" id="prevLightbox">Previous</button>
          <button type="button" id="nextLightbox">Next</button>
          <a id="downloadLink" download>Download</a>
          <a id="openLink" target="_blank" rel="noopener">Open original</a>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 25;
    const state = {
      allAssets: [],
      filtered: [],
      folder: 'all',
      query: '',
      page: 1,
      lightboxIndex: -1
    };

    const galleryEl = document.getElementById('gallery');
    const summaryEl = document.getElementById('summary');
    const chipListEl = document.getElementById('chipList');
    const paginationEl = document.getElementById('pagination');
    const searchInput = document.getElementById('search');
    const allChip = chipListEl.querySelector('[data-folder="all"]');
    const lightboxEl = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxMeta = document.getElementById('lightboxMeta');
    const downloadLink = document.getElementById('downloadLink');
    const openLink = document.getElementById('openLink');
    const prevBtn = document.getElementById('prevLightbox');
    const nextBtn = document.getElementById('nextLightbox');
    const closeBtn = document.getElementById('closeLightbox');

    function titleFromFile(name) {
      return name
        .replace(/\.[^.]+$/, '')
        .replace(/[\-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b([a-z])/g, (match) => match.toUpperCase());
    }

    function labelFromFolder(folder) {
      return folder
        .split('/')
        .map((part) => part
          .replace(/[\-_]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .replace(/\b([a-z])/g, (match) => match.toUpperCase()))
        .join(' › ');
    }

    function toPath(...segments) {
      return segments
        .map((segment) => segment.split('/').map((part) => encodeURIComponent(part)).join('/'))
        .join('/');
    }

    function setBusy(isBusy) {
      galleryEl.setAttribute('aria-busy', isBusy ? 'true' : 'false');
    }

    async function loadManifest() {
      try {
        const response = await fetch('./Digital_Gratitude_List/manifest.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        const manifest = await response.json();
        buildAssets(manifest);
        renderChips(manifest);
        applyFilters();
      } catch (error) {
        console.error(error);
        summaryEl.textContent = 'Unable to load the gallery right now. Please refresh to try again.';
        galleryEl.innerHTML = '';
        setBusy(false);
      }
    }

    function buildAssets(manifest) {
      const entries = Object.entries(manifest);
      const assets = [];
      entries.forEach(([folder, files]) => {
        files.forEach((file) => {
          const title = titleFromFile(file);
          const path = toPath('Digital_Gratitude_List', folder, file);
          assets.push({
            folder,
            folderLabel: labelFromFolder(folder),
            file,
            path,
            title
          });
        });
      });
      assets.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
      state.allAssets = assets;
    }

    function renderChips(manifest) {
      const fragment = document.createDocumentFragment();
      Object.keys(manifest)
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))
        .forEach((folder) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'chip';
          button.dataset.folder = folder;
          button.setAttribute('role', 'tab');
          button.textContent = labelFromFolder(folder);
          button.addEventListener('click', () => {
            state.folder = folder;
            state.page = 1;
            updateActiveChip();
            applyFilters();
          });
          fragment.appendChild(button);
        });
      chipListEl.appendChild(fragment);
      updateActiveChip();
    }

    function updateActiveChip() {
      const buttons = chipListEl.querySelectorAll('.chip');
      buttons.forEach((button) => {
        const isActive = button.dataset.folder === state.folder || (state.folder === 'all' && button.dataset.folder === 'all');
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
    }

    function applyFilters() {
      const query = state.query.trim().toLowerCase();
      const inFolder = state.folder === 'all'
        ? state.allAssets
        : state.allAssets.filter((asset) => asset.folder === state.folder);
      const filtered = query
        ? inFolder.filter((asset) => asset.title.toLowerCase().includes(query))
        : inFolder;
      state.filtered = filtered;
      const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      state.page = Math.min(state.page, pageCount);
      render();
    }

    function render() {
      const total = state.filtered.length;
      const pageCount = Math.max(1, Math.ceil(total / PAGE_SIZE));
      const startIndex = total ? (state.page - 1) * PAGE_SIZE : 0;
      const endIndex = total ? Math.min(startIndex + PAGE_SIZE, total) : 0;

      summaryEl.textContent = total
        ? `Showing ${startIndex + 1}–${endIndex} of ${total} image${total === 1 ? '' : 's'} · Page ${state.page} of ${pageCount}`
        : 'No images match your filters yet. Try another search or collection.';

      galleryEl.innerHTML = '';

      if (!total) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No results to display.';
        galleryEl.appendChild(empty);
        paginationEl.innerHTML = '';
        paginationEl.style.display = 'none';
        setBusy(false);
        return;
      }

      const fragment = document.createDocumentFragment();
      const items = state.filtered.slice(startIndex, endIndex);
      items.forEach((asset, offset) => {
        const card = document.createElement('article');
        card.className = 'card';

        const button = document.createElement('button');
        button.type = 'button';
        button.addEventListener('click', () => openLightbox(startIndex + offset));

        const img = document.createElement('img');
        img.src = asset.path;
        img.alt = `${asset.title} — ${asset.folderLabel}`;
        img.loading = 'lazy';
        button.appendChild(img);

        const footer = document.createElement('footer');
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = asset.title;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = asset.folderLabel;
        footer.append(title, meta);

        card.append(button, footer);
        fragment.appendChild(card);
      });

      galleryEl.appendChild(fragment);
      renderPagination(pageCount);
      setBusy(false);
    }

    function renderPagination(pageCount) {
      paginationEl.innerHTML = '';
      if (pageCount <= 1) {
        paginationEl.style.display = 'none';
        return;
      }

      const prev = document.createElement('button');
      prev.type = 'button';
      prev.textContent = 'Previous';
      prev.disabled = state.page === 1;
      prev.addEventListener('click', () => {
        if (state.page > 1) {
          state.page -= 1;
          render();
        }
      });

      const next = document.createElement('button');
      next.type = 'button';
      next.textContent = 'Next';
      next.disabled = state.page === pageCount;
      next.addEventListener('click', () => {
        if (state.page < pageCount) {
          state.page += 1;
          render();
        }
      });

      paginationEl.append(prev, next);
      paginationEl.style.display = 'flex';
    }

    function openLightbox(index) {
      const asset = state.filtered[index];
      if (!asset) return;
      state.lightboxIndex = index;

      lightboxImage.src = asset.path;
      lightboxImage.alt = asset.title;
      lightboxTitle.textContent = asset.title;
      lightboxMeta.textContent = asset.folderLabel;
      downloadLink.href = asset.path;
      downloadLink.download = asset.file;
      openLink.href = asset.path;

      lightboxEl.classList.add('open');
      document.body.style.overflow = 'hidden';
      updateLightboxControls();
    }

    function closeLightbox() {
      lightboxEl.classList.remove('open');
      document.body.style.overflow = '';
      state.lightboxIndex = -1;
    }

    function showRelative(delta) {
      const nextIndex = state.lightboxIndex + delta;
      if (nextIndex < 0 || nextIndex >= state.filtered.length) return;
      openLightbox(nextIndex);
    }

    function updateLightboxControls() {
      prevBtn.disabled = state.lightboxIndex <= 0;
      nextBtn.disabled = state.lightboxIndex >= state.filtered.length - 1;
    }

    prevBtn.addEventListener('click', () => showRelative(-1));
    nextBtn.addEventListener('click', () => showRelative(1));
    closeBtn.addEventListener('click', closeLightbox);

    lightboxEl.addEventListener('click', (event) => {
      if (event.target === lightboxEl) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (!lightboxEl.classList.contains('open')) {
        return;
      }
      if (event.key === 'Escape') {
        closeLightbox();
      } else if (event.key === 'ArrowLeft') {
        showRelative(-1);
      } else if (event.key === 'ArrowRight') {
        showRelative(1);
      }
    });

    searchInput.addEventListener('input', () => {
      state.query = searchInput.value;
      state.page = 1;
      applyFilters();
    });

    if (allChip) {
      allChip.addEventListener('click', () => {
        if (state.folder === 'all') {
          return;
        }
        state.folder = 'all';
        state.page = 1;
        updateActiveChip();
        applyFilters();
      });
    }

    updateActiveChip();
    setBusy(true);
    loadManifest();
  </script>
</body>
</html>

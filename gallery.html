<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Gratitude List Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --bg: #0b0f19;
      --panel: #131b2c;
      --border: #1f2940;
      --text: #f1f5ff;
      --muted: #9aa8c7;
      --accent: #7bc5ff;
      --accent-strong: #34a0ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a2742 0%, #05070c 70%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 40px 20px 18px;
    }

    main {
      padding: 0 20px 80px;
      flex: 1;
    }

    .wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 3.5vw, 3.3rem);
      letter-spacing: -0.02em;
    }

    .intro {
      margin-top: 12px;
      color: var(--muted);
      max-width: 72ch;
      line-height: 1.6;
    }

    .panel {
      margin: 28px 0 24px;
      background: rgba(8, 12, 22, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 18px;
      display: grid;
      gap: 18px;
    }

    @media (min-width: 760px) {
      .panel {
        grid-template-columns: minmax(0, 1fr) 240px;
        align-items: center;
      }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button.chip {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    button.chip:hover,
    button.chip:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(123, 197, 255, 0.6);
    }

    button.chip.active {
      background: rgba(123, 197, 255, 0.18);
      border-color: rgba(123, 197, 255, 0.8);
      color: #f8fbff;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(18, 24, 38, 0.9);
      color: inherit;
      font-size: 0.95rem;
    }

    .search svg {
      width: 18px;
      height: 18px;
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .summary {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .summary strong {
      color: #f6f9ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      background: rgba(5, 8, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, border 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover,
    .card:focus-within {
      transform: translateY(-3px);
      border-color: rgba(123, 197, 255, 0.4);
    }

    .card button {
      all: unset;
      cursor: pointer;
      display: block;
      flex: 1;
    }

    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #0f1729;
    }

    .card footer {
      padding: 12px 14px 14px;
      display: grid;
      gap: 6px;
    }

    .card .title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .card .meta {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 32px 0 0;
      flex-wrap: wrap;
    }

    .pagination button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      min-width: 120px;
      font-size: 0.9rem;
      transition: border 0.2s ease, background 0.2s ease;
    }

    .pagination button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination button:not([disabled]):hover,
    .pagination button:not([disabled]):focus-visible {
      outline: none;
      border-color: rgba(123, 197, 255, 0.6);
      background: rgba(123, 197, 255, 0.15);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(5, 9, 18, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      z-index: 100;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      width: min(900px, 100%);
      max-height: 90vh;
      background: rgba(12, 18, 30, 0.9);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .lightbox header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .lightbox h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }

    .lightbox main {
      padding: 0;
      flex: 1;
      display: grid;
      place-items: center;
      background: #020306;
    }

    .lightbox img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #020306;
    }

    .lightbox footer {
      padding: 14px 20px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 10, 20, 0.85);
    }

    .lightbox .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lightbox button,
    .lightbox a {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      padding: 8px 14px;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.9rem;
      transition: border 0.2s ease, background 0.2s ease;
    }

    .lightbox button:hover,
    .lightbox button:focus-visible,
    .lightbox a:hover,
    .lightbox a:focus-visible {
      outline: none;
      border-color: rgba(123, 197, 255, 0.6);
      background: rgba(123, 197, 255, 0.16);
    }

    .empty {
      padding: 60px 0;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Digital Gratitude List</h1>
      <p class="intro">Browse every photographed treasure from the Garage and Workshop. Use the collection filters or search by name to find a specific tool, part, or keepsake. Tap an image for a closer look and download the original file if you want to keep a copy.</p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="panel" aria-label="Gallery controls">
        <div class="chips" id="filterChips" role="tablist" aria-label="Collections">
          <button class="chip active" data-filter="all" role="tab" aria-selected="true">All items</button>
        </div>
        <label class="search">
          <span class="sr-only">Search images</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.79l5 4.99L20.49 19zM10.5 15a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" />
          </svg>
          <input id="searchInput" type="search" placeholder="Search by name or keyword" autocomplete="off" />
        </label>
      </section>

      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="grid" id="gallery" aria-live="polite"></div>
      <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lightbox-content">
      <header>
        <h2 id="lightboxTitle"></h2>
        <button type="button" id="closeLightbox" aria-label="Close viewer">Close</button>
      </header>
      <main>
        <img id="lightboxImage" alt="" />
      </main>
      <footer>
        <span id="lightboxMeta"></span>
        <div class="actions">
          <button type="button" id="prevLightbox" aria-label="View previous image">Prev</button>
          <button type="button" id="nextLightbox" aria-label="View next image">Next</button>
          <a id="downloadLightbox" download>Download</a>
          <a id="openLightbox" target="_blank" rel="noopener">Open original</a>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 25;
    const state = {
      assets: [],
      filtered: [],
      filter: 'all',
      page: 1,
      query: '',
      lightboxIndex: -1
    };

    const galleryEl = document.getElementById('gallery');
    const summaryEl = document.getElementById('summary');
    const chipsEl = document.getElementById('filterChips');
    const paginationEl = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const lightboxEl = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxMeta = document.getElementById('lightboxMeta');
    const downloadLink = document.getElementById('downloadLightbox');
    const openLink = document.getElementById('openLightbox');

    const prevBtn = document.getElementById('prevLightbox');
    const nextBtn = document.getElementById('nextLightbox');
    const closeBtn = document.getElementById('closeLightbox');

    function formatTitle(name) {
      return name
        .replace(/\.[^.]+$/, '')
        .replace(/[\-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b([a-z])/g, (s) => s.toUpperCase());
    }

    function formatFolder(folder) {
      return folder
        .split('/')
        .map((part) => part
          .replace(/[\-_]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .replace(/\b([a-z])/g, (s) => s.toUpperCase())
        )
        .join(' › ');
    }

    async function loadManifest() {
      try {
        const response = await fetch('Digital_Gratitude_List/manifest.json');
        if (!response.ok) {
          throw new Error('Could not load manifest');
        }
        const manifest = await response.json();
        const assets = [];
        for (const [folder, files] of Object.entries(manifest)) {
          for (const file of files) {
            assets.push({
              folder,
              file,
              title: formatTitle(file),
              folderLabel: formatFolder(folder),
              path: `Digital_Gratitude_List/${folder}/${encodeURIComponent(file).replace(/%2F/g, '/')}`
            });
          }
        }
        assets.sort((a, b) => a.title.localeCompare(b.title));
        state.assets = assets;
        buildFilters();
        applyFilters();
      } catch (error) {
        galleryEl.innerHTML = `<p class="empty">${error.message}. Double-check that <code>manifest.json</code> exists in the <code>Digital_Gratitude_List</code> folder.</p>`;
      }
    }

    function buildFilters() {
      const folders = Array.from(new Set(state.assets.map((asset) => asset.folder)));
      const fragment = document.createDocumentFragment();
      folders.sort((a, b) => a.localeCompare(b));
      for (const folder of folders) {
        const button = document.createElement('button');
        button.className = 'chip';
        button.type = 'button';
        button.dataset.filter = folder;
        button.role = 'tab';
        button.textContent = formatFolder(folder);
        button.setAttribute('aria-selected', 'false');
        button.addEventListener('click', () => {
          if (state.filter === folder) {
            return;
          }
          state.filter = folder;
          state.page = 1;
          updateFilterSelection();
          applyFilters();
        });
        fragment.appendChild(button);
      }
      chipsEl.appendChild(fragment);

      chipsEl.addEventListener('click', (event) => {
        const target = event.target.closest('button.chip');
        if (!target) {
          return;
        }
        if (target.dataset.filter === 'all' && state.filter !== 'all') {
          state.filter = 'all';
          state.page = 1;
          updateFilterSelection();
          applyFilters();
        }
      });

      updateFilterSelection();
    }

    function updateFilterSelection() {
      const buttons = chipsEl.querySelectorAll('button.chip');
      buttons.forEach((button) => {
        const isActive = button.dataset.filter === state.filter || (state.filter === 'all' && button.dataset.filter === 'all');
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
    }

    function applyFilters() {
      const query = state.query.trim().toLowerCase();
      const byFolder = state.filter === 'all'
        ? state.assets
        : state.assets.filter((asset) => asset.folder === state.filter);
      state.filtered = query
        ? byFolder.filter((asset) => asset.title.toLowerCase().includes(query))
        : byFolder.slice();
      state.page = Math.min(state.page, Math.max(1, Math.ceil(state.filtered.length / PAGE_SIZE)) || 1);
      render();
    }

    function render() {
      const total = state.filtered.length;
      if (!total) {
        galleryEl.innerHTML = '<p class="empty">No images match your filters yet. Try a different search term or switch collections.</p>';
        paginationEl.innerHTML = '';
        paginationEl.style.display = 'none';
        summaryEl.textContent = 'No items to show.';
        return;
      }

      const startIndex = (state.page - 1) * PAGE_SIZE;
      const endIndex = Math.min(startIndex + PAGE_SIZE, total);
      const pageItems = state.filtered.slice(startIndex, endIndex);

      const fragment = document.createDocumentFragment();
      pageItems.forEach((asset, index) => {
        const card = document.createElement('article');
        card.className = 'card';

        const button = document.createElement('button');
        button.type = 'button';
        button.addEventListener('click', () => openLightbox(startIndex + index));

        const img = document.createElement('img');
        img.src = asset.path;
        img.alt = `${asset.title} — ${asset.folderLabel}`;
        img.loading = 'lazy';
        button.appendChild(img);

        const footer = document.createElement('footer');
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = asset.title;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = asset.folderLabel;
        footer.append(title, meta);

        card.append(button, footer);
        fragment.appendChild(card);
      });

      galleryEl.innerHTML = '';
      galleryEl.appendChild(fragment);

      const pageCount = Math.ceil(total / PAGE_SIZE);
      summaryEl.innerHTML = `<strong>${total}</strong> item${total === 1 ? '' : 's'} found · showing <strong>${startIndex + 1}–${endIndex}</strong> · page <strong>${state.page}</strong> of <strong>${pageCount}</strong>`;

      paginationEl.innerHTML = '';
      const prev = document.createElement('button');
      prev.type = 'button';
      prev.textContent = 'Previous';
      prev.disabled = state.page === 1;
      prev.addEventListener('click', () => {
        if (state.page > 1) {
          state.page -= 1;
          render();
        }
      });
      const next = document.createElement('button');
      next.type = 'button';
      next.textContent = 'Next';
      next.disabled = state.page === pageCount;
      next.addEventListener('click', () => {
        if (state.page < pageCount) {
          state.page += 1;
          render();
        }
      });
      paginationEl.append(prev, next);
      paginationEl.style.display = pageCount > 1 ? 'flex' : 'none';
    }

    function openLightbox(index) {
      state.lightboxIndex = index;
      const asset = state.filtered[index];
      if (!asset) return;

      lightboxTitle.textContent = asset.title;
      lightboxMeta.textContent = asset.folderLabel;
      lightboxImage.src = asset.path;
      lightboxImage.alt = asset.title;
      downloadLink.href = asset.path;
      downloadLink.download = asset.file;
      openLink.href = asset.path;

      lightboxEl.classList.add('open');
      document.body.style.overflow = 'hidden';
      updateLightboxButtons();
    }

    function closeLightbox() {
      lightboxEl.classList.remove('open');
      document.body.style.overflow = '';
      state.lightboxIndex = -1;
    }

    function updateLightboxButtons() {
      prevBtn.disabled = state.lightboxIndex <= 0;
      nextBtn.disabled = state.lightboxIndex >= state.filtered.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (state.lightboxIndex > 0) {
        openLightbox(state.lightboxIndex - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (state.lightboxIndex < state.filtered.length - 1) {
        openLightbox(state.lightboxIndex + 1);
      }
    });

    closeBtn.addEventListener('click', closeLightbox);

    lightboxEl.addEventListener('click', (event) => {
      if (event.target === lightboxEl) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (!lightboxEl.classList.contains('open')) {
        return;
      }
      if (event.key === 'Escape') {
        closeLightbox();
      }
      if (event.key === 'ArrowLeft' && state.lightboxIndex > 0) {
        openLightbox(state.lightboxIndex - 1);
      }
      if (event.key === 'ArrowRight' && state.lightboxIndex < state.filtered.length - 1) {
        openLightbox(state.lightboxIndex + 1);
      }
    });

    searchInput.addEventListener('input', (event) => {
      state.query = event.target.value;
      state.page = 1;
      applyFilters();
    });

    document.addEventListener('DOMContentLoaded', () => {
      updateFilterSelection();
      loadManifest();
    });
  </script>
</body>
</html>

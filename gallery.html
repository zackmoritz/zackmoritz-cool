<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Gratitude List — Browser</title>
<style>
  :root { --bg:#0f1115; --panel:#12161f; --border:#262b36; --text:#e7ecf1; --muted:#9aa6b2; --accent:#1a232f; }
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 14px}
  h1{margin:0 0 6px}
  .small{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .crumb{border:1px solid var(--border);padding:4px 8px;border-radius:999px;background:#141b24;cursor:pointer}
  .crumb.active{background:#1e2a3a}
  .section-title{margin-top:16px;margin-bottom:6px;font-weight:600}
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .folder{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:10px;cursor:pointer}
  .folder .icon{width:36px;height:36px;border-radius:8px;background:#0b0e13;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
  .card{position:relative;display:block;border:1px solid var(--border);background:var(--panel);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--text)}
  .thumb{display:block;width:100%;height:140px;object-fit:cover;background:#0b0e13}
  .label{padding:8px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--border)}
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);border:1px solid var(--border);padding:2px 6px;border-radius:999px;font-size:12px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999}
  .lightbox.open{display:flex}
  .viewer{max-width:92vw;max-height:86vh;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .viewer img,.viewer video,audio{display:block;max-width:92vw;max-height:80vh}
  .viewer .head{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border)}
  .viewer .name{font-size:14px}
  .pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
  .pagebtn{border:1px solid var(--border);background:#12161f;color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .pagebtn[disabled]{opacity:.5;cursor:not-allowed}
  .pagenum{border:1px solid var(--border);background:#12161f;color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .pagenum.active{background:#1a232f}
  select{background:var(--accent);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Digital Gratitude List — Browser</h1>

  <div class="row">
    <div class="small">Root: <code>/Digital_Gratitude_List</code></div>
    <div class="row" style="margin-left:auto">
      <label class="small" for="sortSel">Sort:</label>
      <select id="sortSel">
        <option value="new" selected>Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A–Z</option>
        <option value="za">Z–A</option>
      </select>
    </div>
  </div>

  <!-- Breadcrumbs -->
  <div id="crumbs" class="crumbs"></div>

  <div class="row" style="margin:4px 0 8px">
    <div class="small" id="counts"></div>
    <div class="small" style="margin-left:auto">
      Page <span id="pageInfo">1</span>
    </div>
  </div>

  <!-- Folders -->
  <div id="foldersWrap">
    <div class="section-title small">Folders</div>
    <div id="folders" class="folders"></div>
  </div>

  <!-- Files -->
  <div class="section-title small" style="margin-top:14px">Files</div>
  <div id="grid" class="grid"><div class="small">Loading…</div></div>
  <div id="pager" class="pager" aria-label="Pagination"></div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" aria-hidden="true">
  <div class="viewer">
    <div class="head">
      <div class="name" id="lbName">File</div>
      <div style="display:flex;gap:6px">
        <a id="lbOpen" class="pagebtn" href="#" target="_blank" rel="noopener">Open</a>
        <button id="lbClose" class="pagebtn">Close</button>
      </div>
    </div>
    <div id="lbBody" style="padding:0"></div>
  </div>
</div>

<script>
const API_BASE = "/gallery-api";           // Worker route
const ROOT     = "Digital_Gratitude_List"; // repo folder
const PAGE_SIZE = 25;

const IMG_EXT   = /\.(png|jpe?g|gif|webp|heic|heif)$/i;
const VIDEO_EXT = /\.(mp4|mov|webm|m4v)$/i;
const AUDIO_EXT = /\.(m4a|mp3|wav|ogg)$/i;
const FILE_OK   = /\.(png|jpe?g|gif|webp|heic|heif|mp4|mov|webm|m4v|m4a|mp3|wav|ogg)$/i;

const grid     = document.getElementById('grid');
const pager    = document.getElementById('pager');
const pageInfo = document.getElementById('pageInfo');
const counts   = document.getElementById('counts');
const crumbsEl = document.getElementById('crumbs');
const foldersEl= document.getElementById('folders');
const foldersWrap = document.getElementById('foldersWrap');
const sortSel  = document.getElementById('sortSel');

const lb   = document.getElementById('lightbox');
const lbBody = document.getElementById('lbBody');
const lbName = document.getElementById('lbName');
const lbOpen = document.getElementById('lbOpen');
const lbClose= document.getElementById('lbClose');

lbClose.onclick = () => { lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); lbBody.innerHTML=''; };
lb.addEventListener('click', e => { if (e.target === lb) lbClose.onclick(); });

let CURRENT_PATH = ""; // relative to ROOT
let FILES = [];        // names
let COMMITS = {};      // { name: iso }
let VIEW  = [];        // array of { name, t } for sorting by time
let currentPage = 1, totalPages = 1;

/* URL helpers */
function qs(name, def){ const u=new URL(location.href); return u.searchParams.get(name) ?? def; }
function updateQS(params){
  const u = new URL(location.href);
  Object.entries(params).forEach(([k,v]) => v==null? u.searchParams.delete(k) : u.searchParams.set(k,String(v)));
  history.replaceState(null,'',u.toString());
}

/* Paths */
function fullPath(){ return CURRENT_PATH ? `${ROOT}/${CURRENT_PATH}` : ROOT; }
function pathSegments(){ return CURRENT_PATH ? CURRENT_PATH.split('/').filter(Boolean) : []; }
function siteHref(name){
  return CURRENT_PATH
    ? `/${ROOT}/${CURRENT_PATH.split('/').map(encodeURIComponent).join('/')}/${encodeURIComponent(name)}`
    : `/${ROOT}/${encodeURIComponent(name)}`;
}
function humanLabel(p){ return p ? p.split('/').slice(-1)[0].replace(/_/g,' ') : 'Main'; }

/* API */
async function fetchList(pathRelToRoot, needCommits){
  const url = new URL(API_BASE + "/list", location.origin);
  const repoPath = ["", ROOT, pathRelToRoot].filter(Boolean).join("/");
  url.searchParams.set("path", repoPath);
  if (needCommits) url.searchParams.set("with", "commits");
  const r = await fetch(url.toString(), { headers: { "accept": "application/json" }, cache: "no-store" });
  if (!r.ok) throw new Error(`API ${r.status}`);
  return await r.json(); // { folders, files, commits? }
}

/* Renderers */
function renderCrumbs(){
  const segs = pathSegments();
  crumbsEl.innerHTML = "";
  const rootBtn = document.createElement('button');
  rootBtn.className = 'crumb' + (segs.length===0 ? ' active':'');
  rootBtn.textContent = ROOT;
  rootBtn.onclick = () => { if (CURRENT_PATH!==""){ CURRENT_PATH=""; currentPage=1; loadPath(); } };
  crumbsEl.appendChild(rootBtn);
  let acc = [];
  segs.forEach((seg, idx) => {
    acc.push(seg);
    const b = document.createElement('button');
    b.className = 'crumb' + (idx===segs.length-1 ? ' active' : '');
    b.textContent = seg.replace(/_/g,' ');
    b.onclick = () => { CURRENT_PATH = acc.join('/'); currentPage=1; loadPath(); };
    crumbsEl.appendChild(b);
  });
}

function folderTileHTML(name){
  return `
    <div class="folder" data-sub="${encodeURIComponent(name)}" title="${name}">
      <div class="icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="#9aa6b2"/>
        </svg>
      </div>
      <div>
        <div style="font-size:14px">${name.replace(/_/g,' ')}</div>
        <div class="small">Open folder</div>
      </div>
    </div>`;
}

function cardHTML(name){
  const site = siteHref(name);
  const isImg   = IMG_EXT.test(name);
  const isVideo = VIDEO_EXT.test(name);
  const isAudio = AUDIO_EXT.test(name);
  const badge = isVideo ? 'Video' : isAudio ? 'Audio' : 'Image';
  const data = `data-site="${site}" data-name="${encodeURIComponent(name)}" data-kind="${badge}"`;
  return `
    <a href="${site}" class="card" ${data}>
      <span class="badge">${badge}</span>
      ${isImg ? `<img class="thumb" loading="lazy" alt="" ${data}>`
              : `<img class="thumb" alt="" ${data} style="object-fit:contain" />`}
      <div class="label" title="${name}">${name}</div>
    </a>`;
}

async function headType(url){
  try { const r = await fetch(url, { method:'HEAD' }); return { ok:r.ok, type:r.headers.get('content-type')||'' }; }
  catch { return { ok:false, type:'' }; }
}

function sortFiles(mode){
  if (mode === 'az' || mode === 'za') {
    const sorted = FILES.slice().sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));
    return mode==='az' ? sorted : sorted.reverse();
  }
  // time-based using COMMITS map
  const items = FILES.map(n => ({ name:n, t: COMMITS[n] ? Date.parse(COMMITS[n]) : 0 }));
  items.sort((a,b)=> (b.t||0) - (a.t||0)); // newest first
  if (mode === 'old') items.reverse();
  return items.map(x => x.name);
}

function renderPage(){
  const mode = sortSel.value;
  const names = sortFiles(mode);

  totalPages = Math.max(1, Math.ceil(names.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const slice = names.slice(start, start + PAGE_SIZE);

  grid.innerHTML = slice.map(cardHTML).join('');

  const thumbs = grid.querySelectorAll('img.thumb');
  thumbs.forEach(async img => {
    const site = img.dataset.site, kind = img.dataset.kind;
    if (kind === 'Image') {
      const t = await headType(site);
      img.src = (!t.ok || (t.type||'').includes('text/html')) ? site : site;
    } else {
      img.style.background = '#0b0e13'; img.style.height = '120px';
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">
           <rect width="100%" height="100%" fill="#0b0e13"/>
           <text x="50%" y="50%" fill="#9aa6b2" font-family="system-ui" font-size="28" text-anchor="middle" dominant-baseline="middle">${img.dataset.kind}</text>
         </svg>`
      );
    }
  });

  grid.querySelectorAll('a.card').forEach(a => {
    a.addEventListener('click', async (e) => {
      e.preventDefault();
      const name = decodeURIComponent(a.dataset.name);
      const site = a.dataset.site;
      const kind = a.dataset.kind;
      lbName.textContent = name;

      const t = await headType(site);
      const url = (!t.ok || (t.type||'').includes('text/html')) ? site : site;
      lbOpen.href = url;

      if (kind === 'Image') {
        lbBody.innerHTML = `<img src="${url}" alt="${name}" style="display:block;max-width:92vw;max-height:80vh">`;
      } else if (kind === 'Video') {
        const type = url.endsWith('.mov') ? 'video/quicktime' : 'video/mp4';
        lbBody.innerHTML = `<video controls playsinline preload="metadata" style="max-width:92vw;max-height:80vh"><source src="${url}" type="${type}"></video>`;
      } else {
        lbBody.innerHTML = `<audio controls preload="metadata" style="width:92vw;max-width:800px"><source src="${url}" type="audio/mp4"></audio>`;
      }
      lb.classList.add('open'); lb.setAttribute('aria-hidden','false');
    });
  });

  pageInfo.textContent = `${currentPage} / ${totalPages}`;
  buildPager(names.length);
  updateQS({ path: CURRENT_PATH, sort: mode, page: currentPage });
}

function buildPager(total){
  pager.innerHTML = "";
  const prev = document.createElement('button');
  prev.className = 'pagebtn'; prev.textContent = '‹ Prev';
  prev.disabled = currentPage === 1;
  prev.onclick = () => { currentPage--; renderPage(); };
  pager.appendChild(prev);

  const maxBtns = 7;
  const nums = [];
  if (totalPages <= maxBtns) {
    for (let i=1;i<=totalPages;i++) nums.push(i);
  } else {
    const left = Math.max(1, currentPage - 2);
    const right = Math.min(totalPages, currentPage + 2);
    if (left > 1) nums.push(1, '…');
    for (let i=left;i<=right;i++) nums.push(i);
    if (right < totalPages) nums.push('…', totalPages);
  }

  nums.forEach(n => {
    if (n === '…') { const s=document.createElement('span'); s.className='small'; s.textContent='…'; pager.appendChild(s); return; }
    const b = document.createElement('button');
    b.className = 'pagenum' + (n===currentPage ? ' active' : '');
    b.textContent = n;
    b.onclick = () => { currentPage = n; renderPage(); };
    pager.appendChild(b);
  });

  const next = document.createElement('button');
  next.className = 'pagebtn'; next.textContent = 'Next ›';
  next.disabled = currentPage === totalPages;
  next.onclick = () => { currentPage++; renderPage(); };
  pager.appendChild(next);
}

function renderFolders(subdirs){
  if (!subdirs.length){ foldersWrap.style.display='none'; return; }
  foldersWrap.style.display='';
  subdirs.sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));
  foldersEl.innerHTML = subdirs.map(n => `
    <div class="folder" data-sub="${encodeURIComponent(n)}" title="${n}">
      <div class="icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="#9aa6b2"/>
        </svg>
      </div>
      <div>
        <div style="font-size:14px">${n.replace(/_/g,' ')}</div>
        <div class="small">Open folder</div>
      </div>
    </div>`).join('');
  foldersEl.querySelectorAll('.folder').forEach(div => {
    div.addEventListener('click', () => {
      const name = decodeURIComponent(div.dataset.sub);
      CURRENT_PATH = CURRENT_PATH ? `${CURRENT_PATH}/${name}` : name;
      currentPage = 1;
      loadPath();
    });
  });
}

/* Load directory */
async function loadPath(){
  renderCrumbs();
  grid.innerHTML = `<div class="small">Loading ${humanLabel(CURRENT_PATH)}…</div>`;
  pager.innerHTML = ''; foldersEl.innerHTML = ''; counts.textContent = '';

  try {
    const needCommits = (sortSel.value === 'new' || sortSel.value === 'old');
    const data = await fetchList(CURRENT_PATH, needCommits);
    const folders = Array.isArray(data.folders) ? data.folders : [];
    const files   = Array.isArray(data.files)   ? data.files   : [];
    COMMITS = data.commits || {};

    renderFolders(folders);

    FILES = files.filter(n => FILE_OK.test(n));

    const imgCount = FILES.filter(n => IMG_EXT.test(n)).length;
    counts.textContent = `${humanLabel(CURRENT_PATH)} — ${imgCount} images, ${FILES.length} items`;

    currentPage = Number(qs('page', 1)) || 1;
    renderPage();

  } catch (err) {
    grid.innerHTML = `<div class="small">Error: ${err.message}</div>`;
  }
}

/* Init */
(function init(){
  CURRENT_PATH = (qs('path','') || '').replace(/^\/+|\/+$/g,''); // normalize
  const qsSort = qs('sort','new');
  if (['new','old','az','za'].includes(qsSort)) sortSel.value = qsSort;
  sortSel.onchange = () => { currentPage = 1; loadPath(); };
  loadPath();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Gratitude List Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --bg: #0d111b;
      --panel: #151b27;
      --border: #222a39;
      --text: #e9efff;
      --muted: #98a2b8;
      --accent: #7bc5ff;
      --chip: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #141b2d, #05070c 60%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 32px 18px 12px;
    }

    main {
      padding: 0 18px 60px;
      flex: 1;
    }

    .wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 3vw, 3.1rem);
      letter-spacing: -0.02em;
    }

    .intro {
      margin-top: 10px;
      color: var(--muted);
      max-width: 70ch;
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .controls {
      margin: 24px 0 20px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(7, 10, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      gap: 12px;
    }

    @media (min-width: 720px) {
      .controls {
        grid-template-columns: auto 240px;
        align-items: center;
      }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button.chip {
      border: 1px solid var(--border);
      background: var(--chip);
      color: inherit;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.18s ease, border 0.18s ease, background 0.18s ease;
    }

    button.chip:hover,
    button.chip:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(123, 197, 255, 0.5);
    }

    button.chip.active {
      background: rgba(123, 197, 255, 0.16);
      border-color: rgba(123, 197, 255, 0.7);
      color: #f5faff;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 22, 32, 0.85);
      color: inherit;
      font-size: 0.95rem;
    }

    .search svg {
      width: 18px;
      height: 18px;
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .summary {
      margin: 4px 0 18px;
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: transform 0.18s ease, border 0.18s ease;
    }

    .card:hover,
    .card:focus-visible {
      outline: none;
      transform: translateY(-2px);
      border-color: rgba(123, 197, 255, 0.6);
    }

    .card img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #05070c;
    }

    .card .meta {
      padding: 10px 12px;
    }

    .card .meta .name {
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .card .meta .folder {
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .pagination {
      margin: 24px 0 0;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .pagination button {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: inherit;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.18s ease, border 0.18s ease, background 0.18s ease;
    }

    .pagination button:hover:not(:disabled),
    .pagination button:focus-visible:not(:disabled) {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(123, 197, 255, 0.6);
    }

    .pagination button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    dialog#lightbox {
      border: none;
      border-radius: 18px;
      padding: 0;
      background: rgba(10, 14, 22, 0.95);
      color: inherit;
      width: min(920px, 92vw);
    }

    dialog::backdrop {
      background: rgba(2, 6, 12, 0.82);
      backdrop-filter: blur(2px);
    }

    .lightbox-head {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lightbox-title {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .lightbox-actions {
      display: flex;
      gap: 8px;
    }

    .lightbox-actions a,
    .lightbox-actions button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: inherit;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .lightbox-body {
      padding: 0;
    }

    .lightbox-body img {
      display: block;
      max-width: min(900px, 90vw);
      max-height: min(70vh, 600px);
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #02050a;
    }

    @media (max-width: 640px) {
      header {
        padding-top: 24px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .card img {
        height: 140px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Digital Gratitude List</h1>
      <p class="intro">Browse the gratitude catalog photographed in the Garage and Workshop collections. Use the filters to narrow the view and open any thumbnail for a closer look.</p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="controls" aria-label="Gallery filters">
        <div class="chips" id="folderChips" role="tablist" aria-label="Folders"></div>
        <label class="search">
          <span class="sr-only">Search images</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.79l4.25 4.25 1.49-1.49L15.5 14Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z" />
          </svg>
          <input id="search" type="search" placeholder="Search titles" autocomplete="off">
        </label>
      </section>

      <div class="summary" id="summary"></div>
      <div class="grid" id="grid" role="list"></div>
      <nav class="pagination" id="pagination" aria-label="Gallery pagination"></nav>
    </div>
  </main>

  <dialog id="lightbox" aria-modal="true">
    <div class="lightbox-head">
      <div class="lightbox-title" id="lightboxTitle">Image</div>
      <div class="lightbox-actions">
        <a id="downloadLink" href="#" download>Download</a>
        <a id="openLink" href="#" target="_blank" rel="noopener">Open original</a>
        <button type="button" id="closeLightbox">Close</button>
      </div>
    </div>
    <div class="lightbox-body" id="lightboxBody"></div>
  </dialog>

  <script>
    const PAGE_SIZE = 25;
    const RAW_DATA = JSON.parse(document.getElementById('gallery-data').textContent);

    const ITEMS = Object.entries(RAW_DATA).flatMap(([folder, files]) =>
      files.map((file) => ({
        name: file,
        folder,
        path: `Digital_Gratitude_List/${folder ? folder + '/' : ''}${file}`
      }))
    );

    const folderChips = document.getElementById('folderChips');
    const searchInput = document.getElementById('search');
    const grid = document.getElementById('grid');
    const pagination = document.getElementById('pagination');
    const summary = document.getElementById('summary');

    const lightbox = document.getElementById('lightbox');
    const lightboxBody = document.getElementById('lightboxBody');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const closeLightbox = document.getElementById('closeLightbox');
    const downloadLink = document.getElementById('downloadLink');
    const openLink = document.getElementById('openLink');

    const folders = ['All', ...Object.keys(RAW_DATA)];
    let activeFolder = 'All';
    let query = '';
    let page = 1;

    function normalise(str) {
      return str.toLowerCase().replace(/[_-]+/g, ' ');
    }

    function getFilteredItems() {
      return ITEMS.filter((item) => {
        const matchesFolder = activeFolder === 'All' || item.folder === activeFolder;
        const matchesQuery = !query || normalise(item.name).includes(query) || normalise(item.folder).includes(query);
        return matchesFolder && matchesQuery;
      });
    }

    function renderChips() {
      folderChips.innerHTML = '';
      folders.forEach((folder) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `chip${folder === activeFolder ? ' active' : ''}`;
        btn.textContent = folder.split('/').pop() || folder;
        btn.dataset.folder = folder;
        btn.addEventListener('click', () => {
          activeFolder = folder;
          page = 1;
          render();
        });
        folderChips.appendChild(btn);
      });
    }

    function renderGrid(items) {
      grid.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('p');
        empty.textContent = 'No items match your filters yet.';
        empty.style.color = 'var(--muted)';
        grid.appendChild(empty);
        return;
      }

      items.forEach((item) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.setAttribute('role', 'listitem');
        card.innerHTML = `
          <img src="${item.path}" alt="${item.name}">
          <div class="meta">
            <div class="name">${item.name}</div>
            <div class="folder">${item.folder}</div>
          </div>
        `;
        card.addEventListener('click', () => openLightbox(item));
        grid.appendChild(card);
      });
    }

    function renderPagination(totalItems) {
      pagination.innerHTML = '';
      const totalPages = Math.ceil(totalItems / PAGE_SIZE);
      if (totalPages <= 1) {
        pagination.hidden = true;
        return;
      }
      pagination.hidden = false;

      const prev = document.createElement('button');
      prev.type = 'button';
      prev.textContent = 'Previous';
      prev.disabled = page === 1;
      prev.addEventListener('click', () => {
        if (page > 1) {
          page--;
          render();
        }
      });

      const next = document.createElement('button');
      next.type = 'button';
      next.textContent = 'Next';
      next.disabled = page >= totalPages;
      next.addEventListener('click', () => {
        if (page < totalPages) {
          page++;
          render();
        }
      });

      const indicator = document.createElement('span');
      indicator.textContent = `Page ${page} of ${totalPages}`;

      pagination.append(prev, indicator, next);
    }

    function renderSummary(totalItems) {
      if (!totalItems) {
        summary.textContent = 'No items to show.';
        return;
      }
      const start = (page - 1) * PAGE_SIZE + 1;
      const end = Math.min(start + PAGE_SIZE - 1, totalItems);
      summary.textContent = `${start}–${end} of ${totalItems} ${totalItems === 1 ? 'item' : 'items'}`;
    }

    function openLightbox(item) {
      lightboxTitle.textContent = `${item.name} (${item.folder})`;
      lightboxBody.innerHTML = '';
      const img = document.createElement('img');
      img.src = item.path;
      img.alt = item.name;
      lightboxBody.appendChild(img);

      downloadLink.href = item.path;
      downloadLink.download = item.name;
      openLink.href = item.path;

      if (typeof lightbox.showModal === 'function' && !lightbox.open) {
        lightbox.showModal();
      }
    }

    closeLightbox.addEventListener('click', () => {
      if (lightbox.open) {
        lightbox.close();
      }
    });

    lightbox.addEventListener('cancel', (event) => {
      event.preventDefault();
      lightbox.close();
    });

    function render() {
      const filtered = getFilteredItems();
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (page > totalPages) {
        page = totalPages;
      }
      const startIndex = (page - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(startIndex, startIndex + PAGE_SIZE);
      renderGrid(pageItems);
      renderPagination(total);
      renderSummary(total);
      Array.from(folderChips.children).forEach((chip) => {
        chip.classList.toggle('active', chip.dataset.folder === activeFolder);
      });
    }

    searchInput.addEventListener('input', (event) => {
      query = normalise(event.target.value.trim());
      page = 1;
      render();
    });

    renderChips();
    render();
  </script>

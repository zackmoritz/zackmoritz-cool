<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zack Moritz | Official Site</title>
    <style>
        :root {
            --primary-blue: #1b365d; /* Deep professional blue */
            --gold-accent: #c5a059;  /* Elegant gold */
            --bg-light: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #fff;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #eee;
        }

        .logo {
            max-width: 250px;
            height: auto;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Video Section */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .video-container video, 
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Contact Form */
        .contact-section {
            margin-top: 60px;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary-blue);
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }

        button {
            background-color: var(--primary-blue);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--gold-accent);
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <img src="http://zackmoritz.cool/videofolder/logo.png" alt="Zack Moritz Logo" class="logo">
    </header>

    <div class="container">
        <div class="video-container">
            <iframe src="https://customer-nlxh7gcbfxnca4cu.cloudflarestream.com/ece267465cbd3fc12689fd5a5f8d6da2/manifest/video.m3u8" allowfullscreen></iframe>
        </div>

        <div class="contact-section">
            <h2>Get in Touch</h2>
            <form action="mailto:zack@zackmoritz.cool" method="post" enctype="text/plain">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="Name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" name="Subject" placeholder="What is this about?" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="Message" rows="5" placeholder="How can I help you?" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 zackmoritz.cool | All Rights Reserved.
    </footer>

</body>
</html>

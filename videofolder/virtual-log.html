<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zack Moritz | Official Site</title>
    <style>
        :root {
            --primary-blue: #1b365d;
            --gold-accent: #c5a059;
            --bg-light: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #fff;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #eee;
        }

        .logo {
            max-width: 250px;
            height: auto;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Updated Video Section - Eliminates Black Boxes */
        .video-container {
            width: 100%;
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            line-height: 0;
        }

        /* Cloudflare Stream Player sizing */
        stream {
            width: 100%;
            aspect-ratio: auto; /* Adjusts to your video's actual shape */
        }

        /* Contact Form */
        .contact-section {
            margin-top: 60px;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary-blue);
            margin-top: 0;
            text-align: center;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-blue); }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: var(--primary-blue);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--gold-accent);
            transform: translateY(-1px);
        }

        footer {
            text-align: center;
            padding: 60px 40px;
            font-size: 0.85em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        <img src="http://zackmoritz.cool/videofolder/logo.png" alt="Zack Moritz" class="logo">
    </header>

    <div class="container">
        <div class="video-container">
            <stream 
                src="ece267465cbd3fc12689fd5a5f8d6da2" 
                controls 
                preload="auto">
            </stream>
        </div>

        <div class="contact-section">
            <h2>Contact Zack</h2>
            <form action="mailto:zack@zackmoritz.cool" method="post" enctype="text/plain">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="Name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="Message" rows="5" placeholder="How can I help you?" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 zackmoritz.cool
    </footer>

    <script data-cfasync="false" defer src="https://embed.videodelivery.net/embed/sdk.latest.js"></script>

</body>
</html>

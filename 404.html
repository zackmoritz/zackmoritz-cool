<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - zackmoritz.cool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 400px; }
        .code { font-size: 5rem; font-weight: 800; color: #4f46e5; margin-bottom: 12px; }
        h1 { font-size: 1.4rem; color: #f1f5f9; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 28px; font-size: 0.95rem; }
        .btn {
            display: inline-block;
            padding: 11px 24px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a class="btn" href="/login">Go to Login</a>
    </div>
</body>
</html>

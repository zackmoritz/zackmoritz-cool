<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - zackmoritz.cool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.2), transparent 40%),
                radial-gradient(circle at 80% 0%, rgba(139, 92, 246, 0.2), transparent 35%),
                linear-gradient(135deg, #111827 0%, #1f2937 100%);
            color: #111827;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
            padding: 40px 34px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 1.9rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            color: #4b5563;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .hint {
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #eef2ff;
            color: #3730a3;
            font-size: 0.88rem;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f2937;
        }

        input {
            width: 100%;
            border: 1.5px solid #d1d5db;
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 0.98rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn {
            margin-top: 10px;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.28);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(79, 70, 229, 0.34);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 14px;
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            color: #6b7280;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <h1>zackmoritz.cool</h1>
        <p>Member Access</p>
    </div>

    <div class="hint">Temporary demo login is enabled for your single-member setup.</div>

    <div id="successMsg" class="message success">Login successful. Redirecting…</div>
    <div id="errorMsg" class="message error"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username (Email)</label>
            <input type="email" id="username" name="username" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button class="btn" id="submitBtn" type="submit">Sign In</button>
    </form>

    <div class="footer">This login is temporary and intended for development use.</div>
</div>

<script>
    const TEMP_USERNAME = "zackmoritz94@gmail.com";
    const TEMP_PASSWORD = "12345";
    const AUTH_KEY = "memberSiteAuthenticated";

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorMsg.style.display = "none";
        successMsg.style.display = "none";

        const username = usernameInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        submitBtn.disabled = true;

        if (username === TEMP_USERNAME && password === TEMP_PASSWORD) {
            localStorage.setItem(AUTH_KEY, "true");
            localStorage.setItem("userEmail", TEMP_USERNAME);
            successMsg.style.display = "block";

            setTimeout(function () {
                window.location.href = "/backoffice.html";
            }, 800);
            return;
        }

        errorMsg.textContent = "Invalid username or password.";
        errorMsg.style.display = "block";
        submitBtn.disabled = false;
    });
</script>
</body>
</html>

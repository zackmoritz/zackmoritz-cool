<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - zackmoritz.cool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 42px 34px;
            width: 100%;
            max-width: 450px;
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .logo p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            outline: none;
        }
        input:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1); }
        input:disabled { background: #f5f5f5; cursor: not-allowed; }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .footer-text { text-align: center; margin-top: 18px; color: #666; font-size: 14px; }
        .footer-text a { color: #667eea; text-decoration: none; font-weight: 600; }
        .error { color: #e74c3c; font-size: 12px; margin-top: 6px; display: none; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        .error-msg { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>zackmoritz.cool</h1>
            <p>Create a temporary account</p>
        </div>

        <div class="message success" id="successMsg">🎉 Account created. Redirecting to backoffice...</div>
        <div class="message error-msg" id="errorMsg"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="zackmoritz94" required>
                <div class="error" id="usernameError">Username is required</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <div class="error" id="passwordError">Password must be at least 4 characters</div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Create Account</button>
        </form>

        <div class="footer-text">Already have an account? <a href="/login/login.html">Sign in</a></div>
    </div>

<script>
    const AUTH_KEY = "memberSiteAuthenticated";

    const form = document.getElementById("registerForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const usernameError = document.getElementById("usernameError");
    const passwordError = document.getElementById("passwordError");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        usernameError.style.display = "none";
        passwordError.style.display = "none";
        successMsg.style.display = "none";
        errorMsg.style.display = "none";

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        let hasError = false;
        if (!username) {
            usernameError.style.display = "block";
            hasError = true;
        }
        if (!password || password.length < 4) {
            passwordError.style.display = "block";
            hasError = true;
        }
        if (hasError) return;

        submitBtn.disabled = true;
        usernameInput.disabled = true;
        passwordInput.disabled = true;

        try {
            const emailFallback = username.includes("@") ? username : `${username}@temp.local`;

            const response = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email: emailFallback, password })
            });

            const data = await response.json();
            if (!response.ok) {
                const message = (data.error || "Registration failed. Please try again.");
                throw new Error(message);
            }

            localStorage.setItem(AUTH_KEY, "true");
            localStorage.setItem("userEmail", data.email || username);

            successMsg.style.display = "block";
            setTimeout(function() {
                window.location.href = "/login/backoffice.html";
            }, 700);
        } catch (error) {
            errorMsg.textContent = error.message;
            errorMsg.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            usernameInput.disabled = false;
            passwordInput.disabled = false;
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome - zackmoritz.cool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #020617;
      --bg-2: #111827;
      --card: rgba(15, 23, 42, 0.72);
      --line: rgba(148, 163, 184, 0.24);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-2: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.24), transparent 34%),
        radial-gradient(circle at 86% 6%, rgba(124, 58, 237, 0.24), transparent 36%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 30px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c4b5fd;
      margin-bottom: 16px;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.15;
      margin-bottom: 14px;
      color: #f8fafc;
    }

    p {
      color: var(--muted);
      font-size: 1.02rem;
      max-width: 56ch;
      margin: 0 auto;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      border-radius: 11px;
      padding: 11px 16px;
      font-weight: 700;
      border: 1px solid transparent;
      transition: transform 120ms ease, filter 120ms ease, border-color 120ms ease;
    }

    .btn.primary {
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(15, 23, 42, 0.6);
      border-color: var(--line);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">Welcome</span>
    <h1>Home Screen</h1>
    <p>
      You’re all set. This backoffice page is now a clean, generic welcome home screen that can be used as a neutral landing page.
    </p>
    <div class="actions">
      <a class="btn primary" href="/">Go to Main Site</a>
      <a class="btn secondary" href="/login/login.html">Open Login</a>
    </div>
  </main>
</body>
</html>
